
apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-deployment
  namespace: employee-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: department

  template:
    metadata:
      labels:
        app: department

    spec:
      containers:
        - name: department-container
          image: acrdemo1.azurecr.io/department-service:v1

          ports:
            - containerPort: 5001

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 15

