
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-deployment
  namespace: employee-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: attendance

  template:
    metadata:
      labels:
        app: attendance

    spec:
      containers:
        - name: attendance-container
          image: YOUR_ACR_NAME.azurecr.io/attendance-service:v1

          ports:
            - containerPort: 5002

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 15

