apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-deployment
  namespace: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      containers:
        - name: employee
          image: acrdemo1.azurecr.io/employee-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
